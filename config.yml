# Blocklist download request timeout
req_timeout_s: 10

# Also block *.domain.tld
wildcard_block: False

# Cache directory
cache: '.cache/bind_rpz_builder'

# Can be either NULL or NXDOMAIN
blocking_mode: 'NXDOMAIN'

# Ads and tracking. Phishing, malware and scam lists are in config-threat.yml,
# built into a separate RPZ zone.

# Blocklists
# List of blocklists
# Format:
#   url: Link to blocklist
#   file: Blocklist file
#   format: domain, hosts or infoblox, default: domain
#   required: true to leave the zone as it is when the list is missing or empty
lists:
  - file: 'blocklist.txt'
  - url: 'https://pgl.yoyo.org/as/serverlist.php?hostformat=nohtml&showintro=0'
  - url: 'http://winhelp2002.mvps.org/hosts.txt'
    format: hosts
  - url: 'https://adaway.org/hosts.txt'
    format: hosts
  - url: 'https://www.someonewhocares.org/hosts/zero/hosts'
    format: hosts

  # adlists from pi-hole: https://github.com/pi-hole/pi-hole/blob/master/adlists.default
  #
  # The below list amalgamates several lists we used previously.
  # See `https://github.com/StevenBlack/hosts` for details
  # StevenBlack's list
  - url: 'https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts'
    format: hosts

  # Disconnect.me Tracking
  - url: 'https://s3.amazonaws.com/lists.disconnect.me/simple_tracking.txt'

  # Disconnect.me Ads
  - url: 'https://s3.amazonaws.com/lists.disconnect.me/simple_ad.txt'

  # HaGeZi's Ultimate DNS Blocklist
  # https://github.com/hagezi/dns-blocklists?tab=readme-ov-file#fake
  - url: 'https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/ultimate-onlydomains.txt'

  # Blocklist Project (ads; its malware, ransomware and scam lists are threats)
  - url: 'https://blocklistproject.github.io/Lists/ads.txt'
    format: hosts

# Don't block domains listed here
domain_whitelist: []
